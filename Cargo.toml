[workspace]
members = [
  "backend",
  "crates/codey-codex-extensions",
  "crates/codey-error-log",
  "crates/codey-fastctx",
  "crates/codey-plugin-sdk",
  "vendor/CodeyRuntime/crates/codey-runtime-core",
  "vendor/CodeyRuntime/crates/codey-runtime-data",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "1.2.7"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
base64 = "0.22"
bytes = "1"
directories = "6"
fastctx = { git = "https://github.com/fraternity-z/fastctx", rev = "36122d57c04832e9a4951b1eb5e3bffbf54ec139", default-features = false }
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["http2", "json", "stream", "rustls-tls", "rustls-tls-native-roots", "system-proxy"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
toml_edit = "0.22"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev]
# Keep backtraces without the bulky type and variable debug information.
debug = 1

[profile.dev.package.codey-runtime-data]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
# The request-observation writer is isolated with catch_unwind. Unwinding is
# required for a writer panic to degrade logging instead of terminating the
# latency-sensitive router process.
panic = "unwind"
strip = "symbols"
